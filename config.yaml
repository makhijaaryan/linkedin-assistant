# Single shared config. Model swaps are one-line changes under `routes`.
seed: 573

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  external: data/external
  results: eval/results
  router_log: router/logs/calls.jsonl

providers:
  ollama:     {base_url: http://localhost:11434/v1, api_key_env: null,               private_ok: true}
  groq:       {base_url: https://api.groq.com/openai/v1, api_key_env: GROQ_API_KEY,  private_ok: false}
  gemini:     {base_url: https://generativelanguage.googleapis.com/v1beta/openai/, api_key_env: GEMINI_API_KEY, private_ok: false}
  openrouter: {base_url: https://openrouter.ai/api/v1,   api_key_env: OPENROUTER_API_KEY, private_ok: false, enabled: false}  # optional fallback

# task -> provider/model. Real CVs (private data) may only use providers with private_ok: true.
routes:
  extract_cv:       {provider: ollama,     model: llama3.1:8b}
  extract_job:      {provider: groq,       model: openai/gpt-oss-20b}   # Groq no longer hosts Llama; also gpt-oss-120b, qwen/qwen3.8-27b
  normalize_tiebreak: {provider: ollama,   model: qwen2.5:7b}
  explain:          {provider: ollama,     model: llama3.1:8b}
  critic:           {provider: ollama,     model: qwen2.5:7b}
  proprietary_baseline: {provider: gemini, model: gemini-2.5-flash}   # anonymized Kaggle text only (free tier may train on prompts)

llm:
  temperature: 0
  runs_per_model: 3
  chunk_words: [200, 500]
  chunk_overlap: 0.10

data:                        # Phase 1 (R1) — frozen once ingest.build has run
  dedupe: {num_perm: 128, shingle_words: 5, lsh_threshold: 0.9, handcheck_pairs: 200}
  working_set: {jobs: 20000, resumes_kaggle: all, resumes_corpus: 2500}
  splits: {train: 0.8, dev: 0.1, test: 0.1}
  test_sets: {extraction_jobs: 75, extraction_resumes_kaggle: 45, extraction_resumes_corpus: 30,
              ranking_profiles_kaggle: 25, ranking_profiles_corpus: 15}

stats:
  alpha: 0.05
  bootstrap_resamples: 10000
  permutations: 10000
  noninferiority_delta: {extraction_f1: 3.0, ndcg10: 0.02}
  correction: holm
